<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorizando Gmail — Konteo 05</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,.15);
            border-top-color: #6d5bff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { font-size: 14px; color: rgba(255,255,255,.5); }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Completando autorización…</p>
    <script>
        // Lee el token del hash de la URL (flujo implicit de OAuth 2.0)
        (function () {
            const hash   = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token  = params.get('access_token');
            const error  = params.get('error');
            const expiresIn = parseInt(params.get('expires_in') || '3600', 10);

            if (window.opener) {
                window.opener.postMessage(
                    { type: 'konteo-gmail-oauth', token, error, expiresIn },
                    window.location.origin
                );
                setTimeout(() => window.close(), 500);
            } else {
                document.querySelector('p').textContent =
                    'Esta ventana puede cerrarse manualmente.';
            }
        })();
    </script>
</body>
</html>
